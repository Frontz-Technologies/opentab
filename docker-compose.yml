name: opentab

services:
  web:
    image: ${OPENTAB_IMAGE:-ghcr.io/frontz-technologies/opentab:latest}
    pull_policy: always
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-opentab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opentab}
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      PUBLIC_REGISTRATION: ${PUBLIC_REGISTRATION:-off}
      EMAIL_DRIVER: smtp
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-OpenTab}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      GOTENBERG_URL: http://gotenberg:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FEATURE_AI_EXTRACTION: ${FEATURE_AI_EXTRACTION:-on}
      AI_MODEL_EXTRACTION: ${AI_MODEL_EXTRACTION:-}
      NEXT_PUBLIC_FEATURE_AI_CHAT: ${NEXT_PUBLIC_FEATURE_AI_CHAT:-off}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      ENABLE_QUEUE_DASHBOARD: ${ENABLE_QUEUE_DASHBOARD:-false}
      LEGAL_PRIVACY_URL: ${LEGAL_PRIVACY_URL:-}
      LEGAL_TERMS_URL: ${LEGAL_TERMS_URL:-}
      LEGAL_COOKIES_URL: ${LEGAL_COOKIES_URL:-}
      LEGAL_DPA_URL: ${LEGAL_DPA_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
      db-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${OPENTAB_IMAGE:-ghcr.io/frontz-technologies/opentab:latest}
    pull_policy: always
    restart: always
    command: ["pnpm", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-opentab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opentab}
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      EMAIL_DRIVER: smtp
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-OpenTab}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  db-sync:
    # One-shot init that syncs the live DB schema with the Drizzle schema-
    # as-code via `db:push --force` before web/worker start. Push is the
    # v1 strategy (no migration history): on every `compose up` it diffs
    # schema vs. DB and emits the necessary CREATE/ALTER statements.
    # `--force` accepts destructive operations (column drops, type
    # changes that lose data) without an interactive prompt — required
    # because the container has no TTY. Closed-beta scope makes this
    # acceptable; for the next ring of users we'll switch to a proper
    # `db:migrate` flow with versioned SQL files.
    image: ${OPENTAB_IMAGE:-ghcr.io/frontz-technologies/opentab:latest}
    pull_policy: always
    restart: "no"
    working_dir: /app/packages/db
    command: ["pnpm", "db:push", "--force"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opentab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opentab}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opentab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opentab}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    expose:
      - "3000"
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--chromium-disable-javascript=true"
      - "--api-timeout=60s"

  glitchtip:
    image: glitchtip/glitchtip:6
    pull_policy: always
    restart: always
    expose:
      - "8000"
    environment:
      # Default boot mode is "Web only" — accepts /api/1/store/ events but
      # never processes them (task_id: null, issues never created). Setting
      # SERVER_ROLE=all_in_one runs web + Celery worker + beat in the same
      # container, which is what the upstream sample compose ships.
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://${POSTGRES_USER:-opentab}:${POSTGRES_PASSWORD}@db:5432/glitchtip
      # GlitchTip 6 expects VALKEY_URL (Valkey is the Redis fork upstream uses).
      # Redis 7 is wire-compatible, so we point at the existing redis service.
      VALKEY_URL: redis://redis:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      EMAIL_URL: smtp://${EMAIL_SMTP_USER}:${EMAIL_SMTP_PASSWORD}@${EMAIL_SMTP_HOST}:${EMAIL_SMTP_PORT}
      DEFAULT_FROM_EMAIL: ${EMAIL_FROM_ADDRESS}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_URL}
      ENABLE_USER_REGISTRATION: "false"
    # GlitchTip's image ships no curl/wget but Python is always present
    # (it's a Django app). We probe localhost:8000 with stdlib urllib so
    # Coolify's Traefik can flip the resource to healthy on the first
    # successful response. start_period 60s covers Django + Celery worker
    # + beat cold start; HEALTHCHECK becomes authoritative after that.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=5).status < 500 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
