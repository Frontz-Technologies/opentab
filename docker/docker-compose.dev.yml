# OpenTab — Development Docker Compose
#
# Usage:
#   cd docker
#   cp .env.dev.sample .env
#   docker compose -f docker-compose.dev.yml up --build
#
# Or from project root:
#   make dev

name: opentab-dev

services:
  app:
    container_name: opentab-dev-app
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/apps/web/.next
      - /app/apps/web/.env
      - /app/apps/web/.env.local
    networks:
      - opentab-dev-network

  postgres:
    container_name: opentab-dev-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opentab-dev-network

  redis:
    container_name: opentab-dev-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opentab-dev-network

  gotenberg:
    container_name: opentab-dev-gotenberg
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "3100:3000"
    networks:
      - opentab-dev-network

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  opentab-dev-network:
    driver: bridge
