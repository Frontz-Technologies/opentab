services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opentab}:${POSTGRES_PASSWORD:-opentab_dev}@postgres:5432/${POSTGRES_DB:-opentab_dev}
      POSTGRES_USER: ${POSTGRES_USER:-opentab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opentab_dev}
      POSTGRES_DB: ${POSTGRES_DB:-opentab_dev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-in-production}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/apps/web/.next

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentab_dev}
      POSTGRES_USER: ${POSTGRES_USER:-opentab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opentab_dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opentab} -d ${POSTGRES_DB:-opentab_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "3100:3000"

volumes:
  postgres_data_dev:
  redis_data_dev:
