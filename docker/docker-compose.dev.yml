# OpenTab — Development Docker Compose
#
# Usage:
#   cd docker
#   cp .env.dev.sample .env
#   docker compose -f docker-compose.dev.yml up --build
#
# Or from project root:
#   make dev
#
# Optional: Enable S3 storage with MinIO (for testing S3 before prod):
#   docker compose -f docker-compose.dev.yml --profile s3 up --build
#   (also set S3_* env vars in .env — see .env.dev.sample)

name: opentab-dev

services:
  app:
    container_name: opentab-dev-app
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/apps/web/.next
      - /app/apps/web/.env
      - /app/apps/web/.env.local
    networks:
      - opentab-dev-network

  postgres:
    container_name: opentab-dev-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opentab-dev-network

  redis:
    container_name: opentab-dev-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opentab-dev-network

  minio:
    container_name: opentab-dev-minio
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opentab-dev-network

  createbuckets:
    container_name: opentab-dev-createbuckets
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET:-opentab-uploads};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-opentab-uploads}
    networks:
      - opentab-dev-network

  gotenberg:
    container_name: opentab-dev-gotenberg
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "3100:3000"
    networks:
      - opentab-dev-network

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:

networks:
  opentab-dev-network:
    driver: bridge
