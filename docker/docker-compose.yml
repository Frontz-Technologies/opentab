# OpenTab — Production Docker Compose
#
# Usage:
#   cd docker
#   cp .env.sample .env    # edit with your values
#   docker compose up -d
#
# Or from project root:
#   make prod
#
# Caddy provides automatic HTTPS. Set DOMAIN in .env to your domain.

name: opentab

services:
  app:
    container_name: opentab-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opentab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-opentab}
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-opentab-uploads}
      S3_REGION: ${S3_REGION:-eu-west-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - opentab-network

  postgres:
    container_name: opentab-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentab}
      POSTGRES_USER: ${POSTGRES_USER:-opentab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-opentab} -d ${POSTGRES_DB:-opentab}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opentab-network

  redis:
    container_name: opentab-redis
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opentab-network

  gotenberg:
    container_name: opentab-gotenberg
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"
    # gotenberg/gotenberg:8 is distroless — no shell, no curl/wget — so we
    # cannot declare a Docker HEALTHCHECK against /health here. Cold-start
    # and worker-churn windows are absorbed by the retry/timeout logic in
    # apps/web/lib/invoicing/pdf.ts (#155).
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - opentab-network

  caddy:
    container_name: opentab-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks:
      - opentab-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  opentab-network:
    driver: bridge
